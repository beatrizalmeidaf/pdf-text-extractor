<text class="ink" x="24" y="166" font-size="14" font-weight="650">papero · structured</text>
<text class="sub" x="24" y="182" font-size="12">order, tables, formulas, figures</text>
<line class="stem p" x1="250.0" y1="172" x2="369.1" y2="172" stroke-width="2" stroke-linecap="round"/>
