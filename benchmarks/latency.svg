<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Average extraction time per PDF</title>
<desc id="d">PyMuPDF: 97 ms; papero · fast: 136 ms; papero · structured: 543 ms; pypdf: 1.52 s; pdfplumber: 3.56 s; Docling: 82.9 s. Dense arXiv papers, CPU only, log scale.</desc>
<style>.bg{fill:#ffffff}.ink,.val{fill:#1f2328}.sub{fill:#656d76}.grid{stroke:#d8dee4}.dot{fill:#6b7280}.dot.p{fill:#c2410c}.stem{stroke:#d0d7de}.stem.p{stroke:#f6c7a8}.ring{stroke:#ffffff}@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.ink,.val{fill:#e6edf3}.sub{fill:#8d96a0}.grid{stroke:#262c33}.dot{fill:#9ca3af}.dot.p{fill:#fb923c}.stem{stroke:#30363d}.stem.p{stroke:#7c3a12}.ring{stroke:#0d1117}}</style>
